<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003B99"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <filter id="houseShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#003B99" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="100" cy="80" r="65" fill="#EBF4FF" opacity="0.9"/>

  <!-- Chimney -->
  <rect x="125" y="45" width="14" height="25" rx="2" fill="#003B99"/>

  <!-- House Body -->
  <g filter="url(#houseShadow)">
    <!-- Main Wall -->
    <rect x="55" y="70" width="90" height="60" rx="4" fill="url(#wallGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Roof Triangular Gable -->
    <polygon points="100,32 45,74 155,74" fill="url(#roofGrad)"/>
    <!-- Overhang detail -->
    <polygon points="100,28 40,75 48,77 100,36 152,77 160,75" fill="#00D2FF" opacity="0.6"/>
    <!-- Front Door -->
    <rect x="88" y="94" width="24" height="36" rx="2" fill="url(#doorGrad)"/>
    <circle cx="107" cy="112" r="2" fill="#FFD700"/>
    <!-- Windows -->
    <rect x="63" y="85" width="18" height="18" rx="3" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="72" y1="85" x2="72" y2="103" stroke="#0284C7" stroke-width="1"/>
    <line x1="63" y1="94" x2="81" y2="94" stroke="#0284C7" stroke-width="1"/>

    <rect x="119" y="85" width="18" height="18" rx="3" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
    <line x1="128" y1="85" x2="128" y2="103" stroke="#0284C7" stroke-width="1"/>
    <line x1="119" y1="94" x2="137" y2="94" stroke="#0284C7" stroke-width="1"/>
  </g>

  <!-- Floating Golden Key -->
  <g transform="translate(132, 95) rotate(-20)" filter="url(#houseShadow)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="url(#keyGrad)" stroke-width="4"/>
    <rect x="20" y="10" width="22" height="4" rx="2" fill="url(#keyGrad)"/>
    <rect x="34" y="14" width="3" height="6" rx="1" fill="url(#keyGrad)"/>
    <rect x="39" y="14" width="3" height="4" rx="1" fill="url(#keyGrad)"/>
  </g>
</svg>
