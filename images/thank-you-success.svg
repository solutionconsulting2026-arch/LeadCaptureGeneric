<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="successShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Celebratory particles -->
  <circle cx="15" cy="30" r="3" fill="#3B82F6"/>
  <circle cx="105" cy="25" r="4" fill="#F59E0B"/>
  <circle cx="110" cy="85" r="3" fill="#EC4899"/>
  <circle cx="12" cy="80" r="3.5" fill="#8B5CF6"/>
  <rect x="25" y="15" width="4" height="8" rx="2" fill="#F59E0B" transform="rotate(30 25 15)"/>
  <rect x="95" y="100" width="4" height="8" rx="2" fill="#3B82F6" transform="rotate(-45 95 100)"/>
  <rect x="90" cy="40" width="5" height="5" rx="1" fill="#10B981" transform="rotate(20 90 40)"/>

  <!-- Success Circle -->
  <g filter="url(#successShadow)">
    <circle cx="60" cy="60" r="44" fill="url(#successGrad)"/>
    <!-- Inner subtle ring -->
    <circle cx="60" cy="60" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <!-- Animated Checkmark -->
    <path d="M 43 60 L 54 71 L 78 47" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
